<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5115 Scouter Dashboard</title>
    <style>
        /* Team 5115 Brand Color Identity */
        :root {
            --bg-dark: #0a0514;       /* Deep Midnight Purple */
            --bg-card: #150d26;       /* Dark Purple Card Surface */
            --primary: #ff7300;       /* Highly Vibrant Coppery Orange */
            --primary-hover: #e06600; /* Darker vibrant orange */
            --text-main: #f3f0f7;     /* High Contrast Text */
            --text-muted: #a497bd;    /* Lavender Gray Subtexts */
            --border-color: #2b1c47;  /* Purple Framing */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 15px 15px 105px 15px; /* Extra bottom padding keeps clear of the floating nav bar */
        }

        h1 { 
            color: var(--primary); 
            font-size: 1.6rem; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}

        /* Tab Visibility Control */
        .app-view { display: none; }
        .app-view.active-view { display: block; }

        /* Form Layout */
        form { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="number"], select, textarea { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.2s ease;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(255, 115, 0, 0.25); 
        }
        
        button { 
            background: var(--primary); 
            color: #fff; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 700; 
            margin-top: 10px; 
            width: 100%; 
            transition: background 0.2s; 
        }
        button:hover { background: var(--primary-hover); }

        /* Sorting Controls Box */
        .controls { 
            margin-bottom: 20px; 
            background: var(--bg-card); 
            padding: 15px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid var(--border-color);
        }
        .controls select { width: 100%; }

        /* Mobile View Cards UI */
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; } 
        
        tr { 
            background: var(--bg-card); 
            margin-bottom: 15px; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }
        td { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 0; 
            border-bottom: 1px solid rgba(43, 28, 71, 0.4); 
            font-size: 15px; 
        }
        td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        td[data-label="Team #"] { font-size: 1.35rem; color: var(--primary); }
        
        .alliance-input { 
            width: 75px; 
            padding: 8px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: 700;
            border-radius: 8px; 
            border: 2px solid var(--primary); 
            background: var(--bg-dark);
            color: var(--primary);
        }

        /* Expanding Live Team Notes UI Block */
        .notes-row {
            border-bottom: none;
            padding-top: 10px;
            display: block;
        }
        .notes-toggle-btn {
            background: #23163d;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            width: auto;
            margin-top: 0;
            border: 1px solid var(--border-color);
        }
        .notes-container {
            display: none;
            margin-top: 10px;
            background: var(--bg-dark);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .notes-container.open { display: block; }
        .notes-textarea {
            width: 100%;
            height: 70px;
            resize: none;
            font-size: 0.9rem;
            padding: 8px;
            margin-bottom: 8px;
        }
        .notes-save-btn {
            padding: 8px 12px;
            font-size: 0.85rem;
            width: auto;
            float: right;
            margin-top: 0;
        }
        .notes-clear { clear: both; }

        /* Floating Pill Navbar with Sliding Slider Animation Track */
        .sketch-navbar-container {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .sketch-navbar-pill {
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            padding: 4px;
            border-radius: 40px;
            display: flex;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            overflow: hidden;
        }

        /* Animated sliding tab indicator bubble backdrop */
        .nav-slider-bubble {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 6px);
            background-color: var(--primary);
            border-radius: 35px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .nav-pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 2; /* Sits cleanly directly on top of sliding bubble layer */
            transition: color 0.25s ease;
        }

        .nav-pill-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .nav-pill-btn.active-tab {
            color: #ffffff;
        }

        /* Desktop View Adaptation Settings */
        @media (min-width: 992px) {
            body { padding: 30px; max-width: 1300px; margin: 0 auto; }
            .form-grid { grid-template-columns: repeat(3, 1fr); }
            button { width: auto; padding: 12px 30px; align-self: end; }
            .controls { flex-direction: row; align-items: center; }
            .controls select { width: auto; min-width: 250px; }
            
            table { display: table; width: 100%; border-collapse: separate; border-spacing: 0; background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); }
            thead { display: table-header-group; }
            tbody { display: table-row-group; }
            tr { display: table-row; background: none; margin-bottom: 0; border: none; }
            tr:hover { background-color: rgba(43, 28, 71, 0.3); }
            th, td { display: table-cell; padding: 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
            th { background-color: rgba(21, 13, 38, 0.6); color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
            td::before { content: ""; } 
            td[data-label="Team #"] { font-size: 1rem; color: var(--text-main); }
            .alliance-input { width: 70px; }

            .notes-row { display: table-row; }
            .notes-td { display: table-cell; colspan: 7; padding: 0 14px 14px 14px; border-top: none; }
            .notes-container { margin-top: 0; }
        }
    </style>
</head>
<body>

    <h1><span style="color:var(--text-main)">5115</span> Scouter</h1>

    <div id="logView" class="app-view">
        <form id="teamForm">
            <h2>Log / Edit Team Info</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="teamNumber">Team Number</label>
                    <input type="text" id="teamNumber" required placeholder="e.g., 5115" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input type="text" id="teamName" required placeholder="e.g., RoboKnights">
                </div>
                <div class="form-group">
                    <label for="autoOpr">Auto OPR</label>
                    <input type="number" id="autoOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="teleopOpr">Teleop OPR</label>
                    <input type="number" id="teleopOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="avgScore">Avg. Points</label>
                    <input type="number" id="avgScore" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="endgame">Endgame Points</label>
                    <input type="number" id="endgame" step="1" required placeholder="0">
                </div>
                <button type="submit">Save Entry</button>
            </div>
        </form>
    </div>

    <div id="rankingsView" class="app-view active-view">
        <div class="controls">
            <label for="sortBy"><strong>Filter Rank Hierarchy:</strong></label>
            <select id="sortBy" onchange="loadTeams()">
                <option value="allianceRank">Alliance Selection Rank</option>
                <option value="autoOpr">Auto OPR</option>
                <option value="teleopOpr">Teleop OPR</option>
                <option value="avgScore">Avg. Points</option>
                <option value="endgame">Endgame Points</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Alliance Rank</th>
                    <th>Team #</th>
                    <th>Team Name</th>
                    <th>Auto OPR</th>
                    <th>Teleop OPR</th>
                    <th>Avg Points</th>
                    <th>Endgame Pts</th>
                </tr>
            </thead>
            <tbody id="teamsTableBody">
                </tbody>
        </table>
    </div>

    <div class="sketch-navbar-container">
        <div class="sketch-navbar-pill">
            <div class="nav-slider-bubble" id="navBubble"></div>
            
            <button class="nav-pill-btn active-tab" onclick="switchView('rankingsView', this, 0)">
                <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.42 1.72 4.44 4.005 4.901C7.914 15.91 10.13 17 12 17s4.086-1.09 4.995-4.099C19.28 12.44 21 10.42 21 8V7c0-1.1-.9-2-2-2zm-2 5c0 1.2-.53 2.18-1.5 2.65V5h1.5v5zM5 10V5h1.5v7.65C5.53 12.18 5 11.2 5 10zm7 9c-1.66 0-3 1.34-3 3h6c0-1.66-1.34-3-3-3z"/></svg>
                Team Rankings
            </button>
            <button class="nav-pill-btn" onclick="switchView('logView', this, 1)">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Log/Edit Team Info
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcPbzSt-iY8RVsYdZpvIfAAS86CwSYa5Q",
            authDomain: "ftc-team-scouter.firebaseapp.com",
            projectId: "ftc-team-scouter",
            storageBucket: "ftc-team-scouter.firebasestorage.app",
            messagingSenderId: "873760240222",
            appId: "1:873760240222:web:3114e1e3fd6661d1d4facf",
            measurementId: "G-ZCQ4RCQBMD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const teamsCollection = collection(db, "ftc_teams");

        let localTeamsArray = [];

        // Dynamic Tab Routing Switch & Animated Slider Calculator
        window.switchView = function(viewId, clickedButton, indexPosition) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active-view'));
            document.querySelectorAll('.nav-pill-btn').forEach(btn => btn.classList.remove('active-tab'));
            
            document.getElementById(viewId).classList.add('active-view');
            clickedButton.classList.add('active-tab');
            
            // Computes translation offset tracking to slide background bubble precisely
            const bubbleOffset = indexPosition * 100;
            document.getElementById('navBubble').style.transform = `translateX(${bubbleOffset}%)`;
            
            window.scrollTo(0, 0);
        }

        document.getElementById('teamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const teamNum = document.getElementById('teamNumber').value.trim();
            
            const teamData = {
                teamNumber: teamNum,
                teamName: document.getElementById('teamName').value.trim(),
                autoOpr: parseFloat(document.getElementById('autoOpr').value),
                teleopOpr: parseFloat(document.getElementById('teleopOpr').value),
                avgScore: parseFloat(document.getElementById('avgScore').value),
                endgame: parseInt(document.getElementById('endgame').value),
            };

            await setDoc(doc(db, "ftc_teams", teamNum), teamData, { merge: true });
            document.getElementById('teamForm').reset();
            
            // Animates view swap smoothly back to ranking leaderboard tab 
            switchView('rankingsView', document.querySelectorAll('.nav-pill-btn')[0], 0);
        });

        window.updateAllianceRank = async function(teamNum, newRank) {
            const rankVal = parseInt(newRank);
            await updateDoc(doc(db, "ftc_teams", teamNum), {
                allianceRank: isNaN(rankVal) ? 999 : rankVal
            });
        }

        // Global function to update scouting comments directly inside cards
        window.saveTeamNotes = async function(teamNum, textareaElement) {
            const notesText = textareaElement.value.trim();
            const button = textareaElement.nextElementSibling;
            button.innerText = "Saving...";
            
            await updateDoc(doc(db, "ftc_teams", teamNum), {
                teamNotes: notesText
            });
            
            button.innerText = "Saved!";
            setTimeout(() => { button.innerText = "Save Notes"; }, 1500);
        }

        // Toggles local dropdown visibility for the notes window drawer
        window.toggleNotesDrawer = function(teamNum) {
            const drawer = document.getElementById(`notes-${teamNum}`);
            drawer.classList.toggle('open');
        }

        onSnapshot(teamsCollection, (snapshot) => {
            localTeamsArray = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                if (data.allianceRank === undefined) data.allianceRank = 999;
                if (data.autoOpr === undefined) data.autoOpr = data.opr || 0;
                if (data.teleopOpr === undefined) data.teleopOpr = 0;
                if (data.teamNotes === undefined) data.teamNotes = ""; // Null safety string parsing

                localTeamsArray.push(data);
            });
            renderTable();
        });

        window.loadTeams = function() {
            renderTable();
        }

        function renderTable() {
            const sortBy = document.getElementById('sortBy').value;
            
            localTeamsArray.sort((a, b) => {
                if (sortBy === 'allianceRank') {
                    return a.allianceRank - b.allianceRank;
                } else {
                    return (b[sortBy] || 0) - (a[sortBy] || 0);
                }
            });

            const tbody = document.getElementById('teamsTableBody');
            tbody.innerHTML = '';

            localTeamsArray.forEach((team) => {
                // Desktop wrapper or standalone mobile card block rendering
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="Alliance Rank">
                        <input type="number" class="alliance-input" 
                               value="${team.allianceRank === 999 ? '' : team.allianceRank}" 
                               placeholder="--" 
                               onchange="updateAllianceRank('${team.teamNumber}', this.value)"
                               inputmode="numeric">
                    </td>
                    <td data-label="Team #"><b>${team.teamNumber}</b></td>
                    <td data-label="Team Name">${team.teamName}</td>
                    <td data-label="Auto OPR">${team.autoOpr}</td>
                    <td data-label="Teleop OPR">${team.teleopOpr}</td>
                    <td data-label="Avg Points">${team.avgScore}</td>
                    <td data-label="Endgame Pts">${team.endgame}</td>
                    <td class="notes-row">
                        <button class="notes-toggle-btn" onclick="toggleNotesDrawer('${team.teamNumber}')">📄 View/Edit Notes</button>
                        <div class="notes-container" id="notes-${team.teamNumber}">
                            <textarea class="notes-textarea" placeholder="Type strategy notes, autonomous paths, or driver reliability here...">${team.teamNotes}</textarea>
                            <button class="notes-save-btn" onclick="saveTeamNotes('${team.teamNumber}', this.previousElementSibling)">Save Notes</button>
                            <div class="notes-clear"></div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
