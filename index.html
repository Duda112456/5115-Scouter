<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5115 Scouter Dashboard Pro</title>
    <style>
        /* Team 5115 Brand Color Identity */
        :root {
            --bg-dark: #0a0514;       /* Deep Midnight Purple */
            --bg-card: #150d26;       /* Dark Purple Card Surface */
            --primary: #ff7300;       /* Highly Vibrant Coppery Orange */
            --primary-hover: #e06600; /* Darker vibrant orange */
            --text-main: #f3f0f7;     /* High Contrast Text */
            --text-muted: #a497bd;    /* Lavender Gray Subtexts */
            --border-color: #2b1c47;  /* Purple Framing */
            --danger: #dc3545;        /* Crimson Red for Delete Actions */
            --success: #28a745;       /* Green for positive states */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 55px 15px 105px 15px; 
        }

        h1 { 
            color: var(--primary); 
            font-size: 1.6rem; 
            padding-bottom: 12px; 
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}

        /* Top Bar Info */
        .comp-status-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 768px) {
            .comp-status-bar { flex-direction: row; }
        }

        .active-comp-info {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .active-comp-info strong {
            color: var(--primary);
        }
        .frozen-badge {
            background: rgba(220, 53, 69, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 6px;
            text-transform: uppercase;
        }

        /* Toggle Button Group Styles */
        .toggle-group {
            display: inline-flex;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 30px;
        }
        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: auto;
            margin-top: 0;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Tab Visibility Control */
        .app-view { display: none; }
        .app-view.active-view { display: block; }

        /* Form Layout */
        form { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="number"], select, textarea { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.2s ease;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(255, 115, 0, 0.25); 
        }
        
        button { 
            background: var(--primary); 
            color: #fff; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 700; 
            margin-top: 10px; 
            width: 100%; 
            transition: background 0.2s; 
        }
        button:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: #23163d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { background: #312054; }

        .btn-success {
            background: var(--success);
        }
        .btn-success:hover { background: #218838; }

        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover { background: #bd2130; }

        /* Sorting Controls Box */
        .controls { 
            margin-bottom: 20px; 
            background: var(--bg-card); 
            padding: 15px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid var(--border-color);
        }
        .controls select { width: 100%; }

        /* Mobile View Cards UI */
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; } 
        
        tr { 
            background: var(--bg-card); 
            margin-bottom: 15px; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            transition: background-color 0.3s ease;
        }
        td { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 0; 
            border-bottom: 1px solid rgba(43, 28, 71, 0.4); 
            font-size: 15px; 
        }
        td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        td[data-label="Team #"] { font-size: 1.35rem; color: var(--primary); }
        
        .alliance-input { 
            width: 70px; 
            padding: 6px; 
            text-align: center; 
            font-size: 15px; 
            font-weight: 700;
            border-radius: 8px; 
            border: 2px solid var(--primary); 
            background: var(--bg-dark);
            color: var(--primary);
        }
        .alliance-input:disabled {
            border-color: var(--border-color);
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* 3x Orange Flash Notification Effects */
        .flash-notify {
            animation: orangeFlash 0.5s ease-in-out 3;
        }

        @keyframes orangeFlash {
            0%, 100% { background-color: var(--bg-card); }
            50% { background-color: rgba(255, 115, 0, 0.45); }
        }

        /* Top Sticky Live Feed Ticker System Banner */
        .ticker-banner-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #200f3a;
            border-bottom: 2px solid var(--primary);
            color: #ffffff;
            height: 38px;
            overflow: hidden;
            white-space: nowrap;
            z-index: 2000;
            display: none; 
            align-items: center;
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            animation: scrollTicker 12s linear infinite;
        }
        .ticker-text span {
            color: var(--primary);
        }

        @keyframes scrollTicker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Expanding Live Team Notes UI Block */
        .notes-column-cell {
            border-bottom: none;
            padding-top: 10px;
            display: block;
        }
        .notes-toggle-btn {
            background: #23163d;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            width: auto;
            margin-top: 0;
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .notes-toggle-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--primary);
            display: block;
        }
        
        /* Prevents empty space lines on mobile layout rows */
        .drawer-row-wrapper {
            display: contents;
        }

        .drawer-fullwidth-cell {
            display: block;
            width: 100%;
            padding: 0;
        }

        .notes-container {
            display: none;
            margin-top: -10px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--primary);
            text-align: left;
        }
        .notes-container.open { display: block; }
        
        /* AI Summary Display Box styling */
        .ai-summary-display {
            background: rgba(255, 115, 0, 0.07);
            border-left: 3px solid var(--primary);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.4;
        }
        .ai-summary-display strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ai-summary-display ul {
            padding-left: 16px;
            margin-top: 4px;
        }

        .notes-textarea {
            width: 100%;
            height: 80px;
            resize: none;
            font-size: 0.9rem;
            padding: 8px;
            margin-bottom: 8px;
            background-color: var(--bg-dark);
        }
        .notes-button-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .notes-save-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
        }
        .notes-close-btn {
            background: #23163d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
        }
        .notes-close-btn:hover { background: #312054; }
        
        .profile-delete-btn {
            background: var(--danger);
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
            margin-right: auto; 
        }
        .profile-delete-btn:hover { background: #bd2130; }

        .notes-clear { clear: both; }

        /* Floating Pill Navbar with Sliding Slider Animation Track */
        .sketch-navbar-container {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .sketch-navbar-pill {
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            padding: 4px;
            border-radius: 40px;
            display: flex;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            overflow: hidden;
        }

        /* Animated sliding tab indicator bubble backdrop */
        .nav-slider-bubble {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 6px);
            background-color: var(--primary);
            border-radius: 35px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .nav-pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 2; 
            transition: color 0.25s ease;
            width: auto;
            margin: 0;
            line-height: 1;
        }

        .nav-pill-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            display: block;
            flex-shrink: 0;
        }

        .nav-pill-btn.active-tab { color: #ffffff; }

        /* Desktop View Adaptation Settings */
        @media (min-width: 992px) {
            body { padding: 60px 30px 105px 30px; max-width: 1350px; margin: 0 auto; }
            .form-grid { grid-template-columns: repeat(3, 1fr); }
            button { width: auto; padding: 12px 30px; align-self: end; }
            .controls { flex-direction: row; align-items: center; }
            .controls select { width: auto; min-width: 250px; }
            
            table { 
                display: table; 
                width: 100%; 
                border-collapse: separate; 
                border-spacing: 0; 
                background: var(--bg-card); 
                border-radius: 16px; 
                overflow: hidden; 
                border: 1px solid var(--border-color); 
                table-layout: fixed; 
            }
            thead { display: table-header-group; }
            tbody { display: table-row-group; }
            tr { display: table-row; background: none; margin-bottom: 0; border: none; }
            tr:hover { background-color: rgba(43, 28, 71, 0.3); }
            
            th, td { 
                display: table-cell; 
                padding: 16px 12px; 
                text-align: center; 
                vertical-align: middle; 
                border-bottom: 1px solid var(--border-color); 
            }
            
            th:nth-child(3), td:nth-child(3) { text-align: left; } 
            
            th { background-color: rgba(21, 13, 38, 0.6); color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }

            td::before { content: ""; } 
            td[data-label="Team Rank"] { font-size: 1rem; color: var(--text-main); }
            .alliance-input { width: 65px; margin: 0 auto; display: block; }

            .notes-column-cell { display: table-cell; text-align: center; }
            .drawer-row-wrapper { display: table-row; }
            .drawer-fullwidth-cell { display: table-cell; padding: 0 20px 20px 20px; border-top: none; background: rgba(10, 5, 20, 0.15); }
            .notes-container { margin-top: 0; margin-bottom: 0; background: var(--bg-dark); border-radius: 10px; border: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <div class="ticker-banner-wrap" id="tickerBanner">
        <div class="ticker-text" id="tickerText"></div>
    </div>

    <h1><span style="color:var(--text-main)">5115</span> Scouter</h1>

    <div class="comp-status-bar">
        <div class="active-comp-info">
            Target Event: <strong id="currentCompDisplay">Loading Event Context...</strong>
            <span id="frozenBadge" class="frozen-badge" style="display:none;">Archived/Frozen</span>
        </div>
        
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
            <div class="toggle-group">
                <button id="viewCompToggle" class="toggle-btn active" onclick="setStatsScope('current')">Event Stats</button>
                <button id="viewCareerToggle" class="toggle-btn" onclick="setStatsScope('career')">Career Stats</button>
            </div>
            <select id="compSelector" onchange="changeActiveCompetitionContext(this.value)" style="padding: 6px 12px; font-size: 0.85rem; border-radius: 20px;">
            </select>
            <button id="newCompBtn" class="btn-success" onclick="createNewCompetitionPrompt()" style="padding: 6px 14px; font-size: 0.85rem; border-radius: 20px; width: auto; margin-top:0;">+ New Event</button>
            <button id="archiveBtn" class="btn-secondary" onclick="archiveCurrentCompetition()" style="padding: 6px 12px; font-size: 0.85rem; border-radius: 20px; width: auto; margin-top:0;">Archive Event</button>
            <button id="unarchiveBtn" class="btn-success" onclick="unarchiveCurrentCompetition()" style="padding: 6px 12px; font-size: 0.85rem; border-radius: 20px; width: auto; margin-top:0; display:none;">Unarchive Event</button>
            <button id="deleteCompBtn" class="btn-danger" onclick="deleteCurrentCompetition()" style="padding: 6px 12px; font-size: 0.85rem; border-radius: 20px; width: auto; margin-top:0;">Delete Event</button>
        </div>
    </div>

    <div id="logView" class="app-view">
        <form id="teamForm">
            <h2 id="formHeaderTitle">Log / Edit Team Info</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="teamNumber">Team Number</label>
                    <input type="text" id="teamNumber" required placeholder="e.g., 5115" inputmode="numeric" oninput="attemptProfileAutoSync(this.value)">
                </div>
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input type="text" id="teamName" required placeholder="e.g., RoboKnights">
                </div>
                <div class="form-group">
                    <label for="autoOpr">Auto OPR</label>
                    <input type="number" id="autoOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="teleopOpr">Teleop OPR</label>
                    <input type="number" id="teleopOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="avgScore">Avg. Points</label>
                    <input type="number" id="avgScore" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="endgame">Endgame Points</label>
                    <input type="number" id="endgame" step="1" required placeholder="0">
                </div>
                <button type="submit" id="formSubmitBtn">Save Entry</button>
            </div>
        </form>
    </div>

    <div id="rankingsView" class="app-view active-view">
        <div class="controls">
            <label for="sortBy"><strong>Filter Rank Hierarchy:</strong></label>
            <select id="sortBy" onchange="renderTable()">
                <option value="overallOpr" id="optOverallOpr">Overall OPR</option>
                <option value="allianceRank" id="optAllianceRank">Team Rank Hierarchy</option>
                <option value="autoOpr">Auto OPR</option>
                <option value="teleopOpr">Teleop OPR</option>
                <option value="avgScore">Avg. Points</option>
                <option value="endgame">Endgame Points</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Team Rank</th>
                    <th>Team #</th>
                    <th>Team Name</th>
                    <th>Overall OPR</th>
                    <th>Auto OPR</th>
                    <th>Teleop OPR</th>
                    <th>Avg Points</th>
                    <th>Endgame Pts</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="teamsTableBody">
            </tbody>
        </table>
    </div>

    <div class="sketch-navbar-container">
        <div class="sketch-navbar-pill">
            <div class="nav-slider-bubble" id="navBubble"></div>
            
            <button class="nav-pill-btn active-tab" onclick="switchView('rankingsView', this, 0)">
                <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.42 1.72 4.44 4.005 4.901C7.914 15.91 10.13 17 12 17s4.086-1.09 4.995-4.099C19.28 12.44 21 10.42 21 8V7c0-1.1-.9-2-2-2zm-2 5c0 1.2-.53 2.18-1.5 2.65V5h1.5v5zM5 10V5h1.5v7.65C5.53 12.18 5 11.2 5 10zm7 9c-1.66 0-3 1.34-3 3h6c0-1.66-1.34-3-3-3z"/></svg>
                Team Rankings
            </button>
            <button class="nav-pill-btn" onclick="switchView('logView', this, 1)">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Log/Edit Info
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, getDocs, getDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcPbzSt-iY8RVsYdZpvIfAAS86CwSYa5Q",
            authDomain: "ftc-team-scouter.firebaseapp.com",
            projectId: "ftc-team-scouter",
            storageBucket: "ftc-team-scouter.firebasestorage.app",
            messagingSenderId: "873760240222",
            appId: "1:873760240222:web:3114e1e3fd6661d1d4facf",
            measurementId: "G-ZCQ4RCQBMD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const compsCollection = collection(db, "competitions");
        const entriesCollection = collection(db, "team_entries");
        const globalProfilesCollection = collection(db, "global_team_profiles");

        let activeCompetitionId = "";
        let competitionsMap = new Map();
        let currentScope = "current"; 

        let rawEntriesArray = [];
        let globalProfilesMap = new Map();
        let activeViewId = 'rankingsView';

        // Initialize Environment
        async function initializeScoutingEnvironment() {
            const snap = await getDocs(compsCollection);
            let contextList = [];
            competitionsMap.clear();
            snap.forEach(d => {
                competitionsMap.set(d.id, d.data());
                contextList.push({id: d.id, ...d.data()});
            });

            let activeComp = contextList.find(c => !c.isArchived);

            if (!activeComp) {
                if (contextList.length === 0) {
                    let newName = prompt("Welcome! No tournament profiles found. Please title your first active competition tracking block:", "Qualifiers Matrix Event");
                    if (!newName || !newName.trim()) newName = "Tournament Event " + new Date().toISOString().split('T')[0];
                    
                    const generatedId = "comp_" + Date.now();
                    const newCompData = {
                        name: newName.trim(),
                        dateStamp: new Date().toISOString().split('T')[0],
                        isArchived: false,
                        createdTime: Date.now()
                    };

                    await setDoc(doc(db, "competitions", generatedId), newCompData);
                    competitionsMap.set(generatedId, newCompData);
                    activeCompetitionId = generatedId;
                } else {
                    let chooseToCreate = confirm("All existing tournament profiles are currently locked/archived.\n\nClick OK (Yes) to establish a new active event profile now.\nClick Cancel (No) to simply inspect past historical event archives.");
                    
                    if (chooseToCreate) {
                        let newName = prompt("Please title your new active Tournament profile:");
                        if (!newName || !newName.trim()) newName = "Tournament Event " + new Date().toISOString().split('T')[0];
                        
                        const generatedId = "comp_" + Date.now();
                        const newCompData = {
                            name: newName.trim(),
                            dateStamp: new Date().toISOString().split('T')[0],
                            isArchived: false,
                            createdTime: Date.now()
                        };

                        await setDoc(doc(db, "competitions", generatedId), newCompData);
                        competitionsMap.set(generatedId, newCompData);
                        activeCompetitionId = generatedId;
                    } else {
                        activeCompetitionId = contextList[0].id;
                    }
                }
            } else {
                activeCompetitionId = activeComp.id;
            }

            repopulateCompetitionDropdownSelector();
            updateCompDisplayState();
            startLiveDataSyncEngines();
        }

        window.createNewCompetitionPrompt = async function() {
            let newName = prompt("Enter a title for your brand-new active Competition profile:", "District Qualifiers");
            if (!newName || !newName.trim()) return;

            const generatedId = "comp_" + Date.now();
            const newCompData = {
                name: newName.trim(),
                dateStamp: new Date().toISOString().split('T')[0],
                isArchived: false,
                createdTime: Date.now()
            };

            await setDoc(doc(db, "competitions", generatedId), newCompData);
            competitionsMap.set(generatedId, newCompData);
            activeCompetitionId = generatedId;

            repopulateCompetitionDropdownSelector();
            updateCompDisplayState();
            renderTable();
        };

        function repopulateCompetitionDropdownSelector() {
            const selector = document.getElementById('compSelector');
            selector.innerHTML = '';
            competitionsMap.forEach((data, id) => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.innerText = data.name + (data.isArchived ? " [Archived]" : "");
                if (id === activeCompetitionId) opt.selected = true;
                selector.appendChild(opt);
            });
        }

        function updateCompDisplayState() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (comp) {
                document.getElementById('currentCompDisplay').innerText = comp.name;
                const frozenBadge = document.getElementById('frozenBadge');
                const archiveBtn = document.getElementById('archiveBtn');
                const unarchiveBtn = document.getElementById('unarchiveBtn');
                
                if (comp.isArchived) {
                    frozenBadge.style.display = "inline-block";
                    archiveBtn.style.display = "none";
                    unarchiveBtn.style.display = "inline-block";
                    document.getElementById('formHeaderTitle').innerText = "Tournament Locked (Archived Mode)";
                    document.getElementById('formSubmitBtn').disabled = true;
                    document.getElementById('formSubmitBtn').innerText = "Locked";
                } else {
                    frozenBadge.style.display = "none";
                    archiveBtn.style.display = "inline-block";
                    unarchiveBtn.style.display = "none";
                    document.getElementById('formHeaderTitle').innerText = "Log / Edit Team Info";
                    document.getElementById('formSubmitBtn').disabled = false;
                    document.getElementById('formSubmitBtn').innerText = "Save Entry";
                }
            }
        }

        window.changeActiveCompetitionContext = function(selectedCompId) {
            activeCompetitionId = selectedCompId;
            updateCompDisplayState();
            renderTable();
        };

        window.archiveCurrentCompetition = async function() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (!comp) return;
            if (comp.isArchived) return;
            if (confirm(`Are you sure you want to archive "${comp.name}"?`)) {
                await updateDoc(doc(db, "competitions", activeCompetitionId), { isArchived: true });
                comp.isArchived = true;
                repopulateCompetitionDropdownSelector();
                updateCompDisplayState();
                renderTable();
            }
        };

        window.unarchiveCurrentCompetition = async function() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (!comp) return;
            if (!comp.isArchived) return;
            if (confirm(`Are you sure you want to unarchive "${comp.name}"?`)) {
                await updateDoc(doc(db, "competitions", activeCompetitionId), { isArchived: false });
                comp.isArchived = false;
                repopulateCompetitionDropdownSelector();
                updateCompDisplayState();
                renderTable();
            }
        };

        window.deleteCurrentCompetition = async function() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (!comp) return;
            if (confirm(`CRITICAL WARNING: Are you sure you want to permanently delete "${comp.name}"? All match data for this event will be lost.`)) {
                await deleteDoc(doc(db, "competitions", activeCompetitionId));
                competitionsMap.delete(activeCompetitionId);
                const remaining = Array.from(competitionsMap.keys());
                if (remaining.length > 0) {
                    activeCompetitionId = remaining[0];
                } else {
                    activeCompetitionId = "";
                }
                await initializeScoutingEnvironment();
            }
        };

        // Realtime Synchronizations
        function startLiveDataSyncEngines() {
            onSnapshot(entriesCollection, (snapshot) => {
                rawEntriesArray = [];
                snapshot.forEach(doc => {
                    rawEntriesArray.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            });

            onSnapshot(globalProfilesCollection, (snapshot) => {
                globalProfilesMap.clear();
                snapshot.forEach(doc => {
                    globalProfilesMap.set(doc.id, doc.data());
                });
                renderTable();
            });
        }

        window.setStatsScope = function(scope) {
            currentScope = scope;
            document.getElementById('viewCompToggle').classList.toggle('active', scope === 'current');
            document.getElementById('viewCareerToggle').classList.toggle('active', scope === 'career');
            
            const sortBy = document.getElementById('sortBy');
            if (scope === 'career') {
                document.getElementById('optAllianceRank').style.display = 'none';
                if (sortBy.value === 'allianceRank') sortBy.value = 'overallOpr';
            } else {
                document.getElementById('optAllianceRank').style.display = 'block';
            }
            renderTable();
        };

        // UI Management & Table Generator
        window.switchView = function(viewId, btnEl, index) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            
            document.querySelectorAll('.nav-pill-btn').forEach(b => b.classList.remove('active-tab'));
            btnEl.classList.add('active-tab');
            
            const bubble = document.getElementById('navBubble');
            bubble.style.transform = `translateX(${index * 100}%)`;
            activeViewId = viewId;
        };

        window.attemptProfileAutoSync = function(teamNum) {
            if (!teamNum) return;
            const globalProf = globalProfilesMap.get(teamNum);
            if (globalProf) {
                document.getElementById('teamName').value = globalProf.name || "";
            }
        };

        // Form Submit Actions
        document.getElementById('teamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const comp = competitionsMap.get(activeCompetitionId);
            if (comp && comp.isArchived) {
                alert("This competition context is archived and locked.");
                return;
            }

            const teamNum = document.getElementById('teamNumber').value.trim();
            const teamName = document.getElementById('teamName').value.trim();
            const autoOpr = parseFloat(document.getElementById('autoOpr').value) || 0;
            const teleopOpr = parseFloat(document.getElementById('teleopOpr').value) || 0;
            const avgScore = parseFloat(document.getElementById('avgScore').value) || 0;
            const endgame = parseFloat(document.getElementById('endgame').value) || 0;

            const entryId = `${activeCompetitionId}_${teamNum}`;
            
            await setDoc(doc(db, "team_entries", entryId), {
                competitionId: activeCompetitionId,
                teamNumber: teamNum,
                teamName: teamName,
                autoOpr: autoOpr,
                teleopOpr: teleopOpr,
                avgScore: avgScore,
                endgame: endgame,
                lastUpdated: Date.now()
            });

            await setDoc(doc(db, "global_team_profiles", teamNum), {
                name: teamName
            }, { merge: true });

            document.getElementById('teamForm').reset();
            switchView('rankingsView', document.querySelectorAll('.nav-pill-btn')[0], 0);
        });
