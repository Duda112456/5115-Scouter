<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5115 Scouter</title>
    <style>
        /* Team 5115 Brand Color Identity */
        :root {
            --bg-dark: #0a0514;       /* Deep Midnight Purple */
            --bg-card: #150d26;       /* Dark Purple Card Surface */
            --primary: #ff7300;       /* Highly Vibrant Coppery Orange */
            --primary-hover: #e06600; /* Darker vibrant orange */
            --text-main: #f3f0f7;     /* High Contrast Text */
            --text-muted: #a497bd;    /* Lavender Gray Subtexts */
            --border-color: #2b1c47;  /* Purple Framing */
            --danger: #dc3545;        /* Crimson Red for Delete Actions */
            --success: #28a745;       /* Green for positive states */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px 15px 120px 15px; 
        }

        h1 { 
            color: var(--primary); 
            font-size: 1.6rem; 
            padding-bottom: 12px; 
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}

        /* Top Bar Info */
        .comp-status-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 768px) {
            .comp-status-bar { flex-direction: row; }
        }

        .active-comp-info {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .active-comp-info strong {
            color: var(--primary);
        }
        .frozen-badge {
            background: rgba(220, 53, 69, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 6px;
            text-transform: uppercase;
        }

        .status-actions-wrapper {
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            align-items: center;
        }

        /* Toggle Button Group Styles */
        .toggle-group {
            display: inline-flex;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 2px;
            border-radius: 20px;
        }
        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: auto;
            margin-top: 0;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Form Controls */
        input[type="text"], input[type="number"], select, textarea { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 10px 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 14px; 
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }

        #compSelector {
            padding: 6px 10px;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        
        button { 
            background: var(--primary); 
            color: #fff; 
            padding: 10px 16px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 700; 
            margin-top: 5px; 
            width: 100%; 
            transition: background 0.2s; 
        }
        button:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: #23163d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { background: #312054; }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #218838; }

        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #bd2130; }

        .action-trigger-btn {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            margin-top: 0;
        }

        /* Tab Visibility Control */
        .app-view { display: none; }
        .app-view.active-view { display: block; }

        /* Form Layout */
        form { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px;
        }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 4px; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        #teamForm button[type="submit"] {
            margin-top: 15px;
            padding: 12px;
        }

        /* Sorting Controls Box */
        .controls { 
            margin-bottom: 15px; 
            background: var(--bg-card); 
            padding: 12px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            border: 1px solid var(--border-color);
        }
        .controls select { width: 100%; }

        /* Mobile View Cards UI */
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; } 
        
        tr { 
            background: var(--bg-card); 
            margin-bottom: 12px; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
        }
        td { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 8px 0; 
            border-bottom: 1px solid rgba(43, 28, 71, 0.4); 
            font-size: 14px; 
        }
        td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.85rem; }
        td[data-label="Team #"] { font-size: 1.2rem; color: var(--primary); }
        
        .alliance-input { 
            width: 55px; 
            padding: 4px; 
            text-align: center; 
            font-size: 14px; 
            font-weight: 700;
            border-radius: 6px; 
            border: 1px solid var(--primary); 
            background: var(--bg-dark);
            color: var(--primary);
        }

        /* Expanding Live Team Notes UI Block */
        .notes-column-cell {
            border-bottom: none;
            padding-top: 8px;
            display: block;
        }
        .notes-toggle-btn {
            background: #23163d;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            width: auto;
            margin-top: 0;
            border: 1px solid var(--border-color);
        }
        
        .drawer-row-wrapper { display: contents; }
        .drawer-fullwidth-cell { display: block; width: 100%; padding: 0; }

        .notes-container {
            display: none;
            margin-top: -6px;
            margin-bottom: 15px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--primary);
        }
        .notes-container.open { display: block; }

        .notes-textarea {
            width: 100%;
            height: 70px;
            resize: none;
            font-size: 0.85rem;
            padding: 6px;
            margin-bottom: 6px;
            background-color: var(--bg-dark);
        }
        .notes-button-group {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .notes-save-btn { padding: 6px 12px; font-size: 0.8rem; width: auto; margin-top: 0; }
        .notes-close-btn { background: #23163d; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; font-size: 0.8rem; width: auto; margin-top: 0; }
        .profile-delete-btn { background: var(--danger); padding: 6px 12px; font-size: 0.8rem; width: auto; margin-top: 0; margin-right: auto; }

        /* Bottom Pill Bar Alignment Selection */
        .sketch-navbar-container {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 9999; 
            pointer-events: none;
        }

        .sketch-navbar-pill {
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            padding: 3px;
            border-radius: 30px;
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            width: 90%;
            max-width: 320px;
        }

        .nav-slider-bubble {
            position: absolute;
            top: 3px;
            left: 3px;
            height: calc(100% - 6px);
            width: calc(50% - 4px); 
            background-color: var(--primary);
            border-radius: 25px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .nav-pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: relative;
            z-index: 2; 
            transition: color 0.2s ease;
            width: 100%;
            margin-top: 0;
        }

        .nav-pill-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            display: block;
        }

        .nav-pill-btn.active-tab { color: #ffffff; }

        /* Desktop View Adaptation Settings */
        @media (min-width: 768px) {
            body { padding: 30px 25px 100px 25px; max-width: 1200px; margin: 0 auto; }
            .form-grid { grid-template-columns: repeat(3, 1fr); }
            #teamForm button[type="submit"] { width: auto; padding: 0 24px; align-self: end; }
            .controls { flex-direction: row; align-items: center; }
            .controls select { width: auto; min-width: 200px; }
            
            .sketch-navbar-pill { width: 100%; }
            .nav-pill-btn { flex-direction: row; font-size: 0.85rem; padding: 10px 12px; gap: 6px; }
            
            table { 
                display: table; 
                width: 100%; 
                border-collapse: separate; 
                background: var(--bg-card); 
                border-radius: 12px; 
                overflow: hidden; 
                border: 1px solid var(--border-color); 
            }
            thead { display: table-header-group; }
            tbody { display: table-row-group; }
            tr { display: table-row; }
            tr:hover { background-color: rgba(43, 28, 71, 0.2); }
            
            th, td { 
                display: table-cell; 
                padding: 12px; 
                text-align: center; 
                vertical-align: middle; 
                border-bottom: 1px solid var(--border-color); 
            }
            th { background-color: rgba(21, 13, 38, 0.4); color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }
            td::before { content: ""; } 

            .notes-column-cell { display: table-cell; text-align: center; }
            .drawer-row-wrapper { display: table-row; }
            .drawer-fullwidth-cell { padding: 0 15px 15px 15px; border-top: none; background: rgba(10, 5, 20, 0.1); }
            .notes-container { margin-top: 0; margin-bottom: 0; background: var(--bg-dark); border-radius: 8px; border: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <h1>5115 Scouter</h1>

    <div class="comp-status-bar">
        <div class="active-comp-info">
            Active Competition Context: <strong id="currentCompDisplay">Syncing Database Context...</strong>
            <span id="frozenBadge" class="frozen-badge" style="display:none;">Archived/Frozen</span>
        </div>
        
        <div class="status-actions-wrapper">
            <div class="toggle-group">
                <button id="viewCompToggle" class="toggle-btn active" onclick="setStatsScope('current')">Event Stats</button>
                <button id="viewCareerToggle" class="toggle-btn" onclick="setStatsScope('career')">Career Stats</button>
            </div>
            <select id="compSelector" onchange="changeActiveCompetitionContext(this.value)">
                <option value="">Syncing database...</option>
            </select>
            <button id="newCompBtn" class="btn-success action-trigger-btn" onclick="createNewCompetitionPrompt()">+ New Event</button>
            <button id="archiveBtn" class="btn-secondary action-trigger-btn" onclick="archiveCurrentCompetition()">Archive Event</button>
            <button id="unarchiveBtn" class="btn-success action-trigger-btn" onclick="unarchiveCurrentCompetition()" style="display:none;">Unarchive Event</button>
            <button id="deleteCompBtn" class="btn-danger action-trigger-btn" onclick="deleteCurrentCompetition()">Delete Event</button>
        </div>
    </div>

    <div id="rankingsView" class="app-view active-view">
        <div class="controls">
            <label for="sortBy"><strong>Filter Rank Hierarchy:</strong></label>
            <select id="sortBy" onchange="renderTable()">
                <option value="overallOpr" id="optOverallOpr">Overall OPR</option>
                <option value="allianceRank" id="optAllianceRank">Team Rank Hierarchy</option>
                <option value="autoOpr">Auto OPR</option>
                <option value="teleopOpr">Teleop OPR</option>
                <option value="avgScore">Avg. Points</option>
                <option value="endgame">Endgame Points</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Team Rank</th>
                    <th>Team #</th>
                    <th>Team Name</th>
                    <th>Overall OPR</th>
                    <th>Auto OPR</th>
                    <th>Teleop OPR</th>
                    <th>Avg Points</th>
                    <th>Endgame Pts</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="teamsTableBody">
                <tr><td colspan="9" style="text-align:center; padding:20px; color:var(--text-muted);">Syncing live active database rows...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="logView" class="app-view">
        <form id="teamForm">
            <h2 id="formHeaderTitle">Log / Edit Team Info</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="teamNumber">Team Number</label>
                    <input type="text" id="teamNumber" required placeholder="e.g., 5115" inputmode="numeric" oninput="attemptProfileAutoSync(this.value)">
                </div>
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input type="text" id="teamName" required placeholder="e.g., RoboKnights">
                </div>
                <div class="form-group">
                    <label for="autoOpr">Auto OPR</label>
                    <input type="number" id="autoOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="teleopOpr">Teleop OPR</label>
                    <input type="number" id="teleopOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="avgScore">Avg. Points</label>
                    <input type="number" id="avgScore" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="endgame">Endgame Points</label>
                    <input type="number" id="endgame" step="1" required placeholder="0">
                </div>
                <button type="submit" id="formSubmitBtn">Save Entry</button>
            </div>
        </form>
    </div>

    <div class="sketch-navbar-container">
        <div class="sketch-navbar-pill">
            <div class="nav-slider-bubble" id="navBubble"></div>
            
            <button class="nav-pill-btn active-tab" onclick="switchView('rankingsView', this, 0)">
                <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.42 1.72 4.44 4.005 4.901C7.914 15.91 10.13 17 12 17s4.086-1.09 4.995-4.099C19.28 12.44 21 10.42 21 8V7c0-1.1-.9-2-2-2zm-2 5c0 1.2-.53 2.18-1.5 2.65V5h1.5v5zM5 10V5h1.5v7.65C5.53 12.18 5 11.2 5 10zm7 9c-1.66 0-3 1.34-3 3h6c0-1.66-1.34-3-3-3z"/></svg>
                Rankings
            </button>
            <button class="nav-pill-btn" onclick="switchView('logView', this, 1)">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Log Info
            </button>
        </div>
    </div>

    <script>
        function switchView(viewId, clickedButton, indexPosition) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active-view'));
            document.querySelectorAll('.nav-pill-btn').forEach(btn => btn.classList.remove('active-tab'));
            
            const targetView = document.getElementById(viewId);
            if(targetView) targetView.classList.add('active-view');
            if(clickedButton) clickedButton.classList.add('active-tab');
            
            const bubble = document.getElementById('navBubble');
            if(bubble) {
                bubble.style.transform = `translateX(${indexPosition * 100}%)`;
            }
            window.scrollTo(0, 0);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, getDocs, getDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcPbzSt-iY8RVsYdZpvIfAAS86CwSYa5Q",
            authDomain: "ftc-team-scouter.firebaseapp.com",
            projectId: "ftc-team-scouter",
            storageBucket: "ftc-team-scouter.firebasestorage.app",
            messagingSenderId: "873760240222",
            appId: "1:873760240222:web:3114e1e3fd6661d1d4facf",
            measurementId: "G-ZCQ4RCQBMD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const compsCollection = collection(db, "competitions");
        const entriesCollection = collection(db, "team_entries");
        const globalProfilesCollection = collection(db, "global_team_profiles");

        let activeCompetitionId = "";
        let competitionsMap = new Map();
        let currentScope = "current"; 

        let rawEntriesArray = [];
        let globalProfilesMap = new Map();
        let isInitialLoad = true;
        let observedVisibleTeams = new Set();

        const rowVisibilityObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const teamNum = entry.target.getAttribute('data-team');
                if (entry.isIntersecting) { observedVisibleTeams.add(teamNum); } 
                else { observedVisibleTeams.delete(teamNum); }
            });
        }, { threshold: 0.05 });

        async function initializeScoutingEnvironment() {
            try {
                const snap = await getDocs(compsCollection);
                let contextList = [];
                competitionsMap.clear();
                snap.forEach(d => {
                    competitionsMap.set(d.id, d.data());
                    contextList.push({id: d.id, ...d.data()});
                });

                let activeComp = contextList.find(c => !c.isArchived);

                if (!activeComp) {
                    if (contextList.length === 0) {
                        let newName = prompt("Welcome! Please title your first active competition tracking block:", "Qualifiers Matrix Event");
                        if (!newName || !newName.trim()) newName = "Tournament Event " + new Date().toISOString().split('T')[0];
                        
                        const generatedId = "comp_" + Date.now();
                        const newCompData = { name: newName.trim(), dateStamp: new Date().toISOString().split('T')[0], isArchived: false, createdTime: Date.now() };
                        await setDoc(doc(db, "competitions", generatedId), newCompData);
                        competitionsMap.set(generatedId, newCompData);
                        activeCompetitionId = generatedId;
                    } else {
                        let chooseToCreate = confirm("All configurations are archived. Create a new active tournament profile?");
                        if (chooseToCreate) {
                            let newName = prompt("Please title your new active Tournament profile:");
                            if (!newName || !newName.trim()) newName = "Tournament Event " + new Date().toISOString().split('T')[0];
                            
                            const generatedId = "comp_" + Date.now();
                            const newCompData = { name: newName.trim(), dateStamp: new Date().toISOString().split('T')[0], isArchived: false, createdTime: Date.now() };
                            await setDoc(doc(db, "competitions", generatedId), newCompData);
                            competitionsMap.set(generatedId, newCompData);
                            activeCompetitionId = generatedId;
                        } else {
                            activeCompetitionId = contextList[0].id;
                        }
                    }
                } else {
                    activeCompetitionId = activeComp.id;
                }

                repopulateCompetitionDropdownSelector();
                updateCompDisplayState();
                startLiveDataSyncEngines();
            } catch(e) {
                console.error("Initialization pipeline failure: ", e);
                document.getElementById('currentCompDisplay').innerText = "Database Connection Broken";
            }
        }

        window.createNewCompetitionPrompt = async function() {
            let newName = prompt("Enter a title for your brand-new active Competition profile:", "District Qualifiers");
            if (!newName || !newName.trim()) return;

            const generatedId = "comp_" + Date.now();
            const newCompData = { name: newName.trim(), dateStamp: new Date().toISOString().split('T')[0], isArchived: false, createdTime: Date.now() };

            await setDoc(doc(db, "competitions", generatedId), newCompData);
            competitionsMap.set(generatedId, newCompData);
            activeCompetitionId = generatedId;

            repopulateCompetitionDropdownSelector();
            updateCompDisplayState();
            renderTable();
        }

        function repopulateCompetitionDropdownSelector() {
            const selector = document.getElementById('compSelector');
            if(!selector) return;
            selector.innerHTML = '';
            
            if(competitionsMap.size === 0) {
                selector.innerHTML = '<option value="">No Events Mapped</option>';
                return;
            }

            competitionsMap.forEach((data, id) => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.innerText = data.name + (data.isArchived ? " [Archived]" : "");
                if (id === activeCompetitionId) opt.selected = true;
                selector.appendChild(opt);
            });
        }

        function updateCompDisplayState() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (comp) {
                document.getElementById('currentCompDisplay').innerText = comp.name;
                const frozenBadge = document.getElementById('frozenBadge');
                const archiveBtn = document.getElementById('archiveBtn');
                const unarchiveBtn = document.getElementById('unarchiveBtn');
                
                if (comp.isArchived) {
                    frozenBadge.style.display = "inline-block";
                    archiveBtn.style.display = "none";
                    unarchiveBtn.style.display = "inline-block";
                    document.getElementById('formHeaderTitle').innerText = "Tournament Locked (Archived Mode)";
                    document.getElementById('formSubmitBtn').disabled = true;
                } else {
                    frozenBadge.style.display = "none";
                    archiveBtn.style.display = "inline-block";
                    unarchiveBtn.style.display = "none";
                    document.getElementById('formHeaderTitle').innerText = "Log / Edit Team Info";
                    document.getElementById('formSubmitBtn').disabled = false;
                }
            }
        }

        window.changeActiveCompetitionContext = function(selectedCompId) {
            if(!selectedCompId) return;
            activeCompetitionId = selectedCompId;
            updateCompDisplayState();
            renderTable();
        }

        window.archiveCurrentCompetition = async function() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (!comp) return;
            if (confirm(`Archive structure dataset for "${comp.name}"?`)) {
                await updateDoc(doc(db, "competitions", activeCompetitionId), { isArchived: true });
                comp.isArchived = true;
                repopulateCompetitionDropdownSelector();
                updateCompDisplayState();
                renderTable();
            }
        }

        window.unarchiveCurrentCompetition = async function() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (!comp) return;
            if (confirm(`Unarchive and re-open writing paths for "${comp.name}"?`)) {
                await updateDoc(doc(db, "competitions", activeCompetitionId), { isArchived: false });
                comp.isArchived = false;
                repopulateCompetitionDropdownSelector();
                updateCompDisplayState();
                renderTable();
            }
        }

        window.deleteCurrentCompetition = async function() {
            const comp = competitionsMap.get(activeCompetitionId);
            if (!comp) return;
            const pinAttempt = prompt(`Master destruction validation code:`);
            if (pinAttempt !== "4994") { alert("Action unauthorized."); return; }

            if (confirm(`Purge profile completely?`)) {
                const q = query(entriesCollection, where("competitionId", "==", activeCompetitionId));
                const entrySnap = await getDocs(q);
                entrySnap.forEach(async (docRef) => {
                    await deleteDoc(doc(db, "team_entries", docRef.id));
                });
                await deleteDoc(doc(db, "competitions", activeCompetitionId));
                await initializeScoutingEnvironment();
            }
        }

        window.setStatsScope = function(scope) {
            currentScope = scope;
            document.getElementById('viewCompToggle').classList.toggle('active', scope === 'current');
            document.getElementById('viewCareerToggle').classList.toggle('active', scope === 'career');
            document.getElementById('sortBy').value = 'overallOpr';
            renderTable();
        }

        window.attemptProfileAutoSync = async function(teamNum) {
            if (!teamNum.trim()) return;
            const profileDoc = await getDoc(doc(db, "global_team_profiles", teamNum.trim()));
            if (profileDoc.exists()) {
                document.getElementById('teamName').value = profileDoc.data().teamName || "";
            }
        }

        window.deleteTeamProfileData = async function(teamNum) {
            if (confirm(`Purge team record metrics baseline data for #${teamNum}?`)) {
                await deleteDoc(doc(db, "team_entries", `${activeCompetitionId}_${teamNum}`));
            }
        }

        document.getElementById('teamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const teamNum = document.getElementById('teamNumber').value.trim();
            const teamNameStr = document.getElementById('teamName').value.trim();
            const entryDocId = `${activeCompetitionId}_${teamNum}`;

            const payload = {
                entryDocId: entryDocId,
                competitionId: activeCompetitionId,
                teamNumber: teamNum,
                teamName: teamNameStr,
                autoOpr: parseFloat(document.getElementById('autoOpr').value) || 0,
                teleopOpr: parseFloat(document.getElementById('teleopOpr').value) || 0,
                avgScore: parseFloat(document.getElementById('avgScore').value) || 0,
                endgame: parseInt(document.getElementById('endgame').value) || 0
            };

            await setDoc(doc(db, "team_entries", entryDocId), payload, { merge: true });
            await setDoc(doc(db, "global_team_profiles", teamNum), { teamNumber: teamNum, teamName: teamNameStr }, { merge: true });

            document.getElementById('teamForm').reset();
            switchView('rankingsView', document.querySelectorAll('.nav-pill-btn')[0], 0);
        });

        window.updateAllianceRank = async function(teamNum, newRank) {
            await updateDoc(doc(db, "team_entries", `${activeCompetitionId}_${teamNum}`), {
                allianceRank: parseInt(newRank) || 999
            });
        }

        window.saveTeamNotes = async function(teamNum, textareaElement) {
            const notesText = textareaElement.value.trim();
            const button = textareaElement.nextElementSibling.nextElementSibling;
            
            button.innerText = "Saving logs...";
            button.disabled = true;
            
            const entryId = `${activeCompetitionId}_${teamNum}`;
            await updateDoc(doc(db, "team_entries", entryId), { teamNotes: notesText });

            button.innerText = "Saved Context";
            button.disabled = false;
            setTimeout(() => { button.innerText = "Save Notes"; }, 1200);
        }

        window.toggleNotesDrawer = function(teamNum) {
            const drawer = document.getElementById(`notes-${teamNum}`);
            if(drawer) drawer.classList.toggle('open');
        }

        function startLiveDataSyncEngines() {
            onSnapshot(entriesCollection, (snapshot) => {
                rawEntriesArray = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    if (data.allianceRank === undefined) data.allianceRank = 999;
                    rawEntriesArray.push(data);
                });
                renderTable();
                isInitialLoad = false;
            });

            onSnapshot(globalProfilesCollection, (snapshot) => {
                snapshot.forEach(doc => { globalProfilesMap.set(doc.id, doc.data()); });
                if (!isInitialLoad) renderTable();
            });
        }

        function generateCompiledDisplayArray() {
            if (currentScope === "current") {
                return rawEntriesArray.filter(e => e.competitionId === activeCompetitionId).map(e => {
                    return { ...e, overallOpr: parseFloat(((e.autoOpr || 0) + (e.teleopOpr || 0)).toFixed(1)) };
                });
            } else {
                const uniqueTeamNumbers = [...new Set(rawEntriesArray.map(e => e.teamNumber))];
                return uniqueTeamNumbers.map(tNum => {
                    const matches = rawEntriesArray.filter(e => e.teamNumber === tNum);
                    const autoAvg = matches.reduce((acc, m) => acc + (m.autoOpr || 0), 0) / matches.length;
                    const teleopAvg = matches.reduce((acc, m) => acc + (m.teleopOpr || 0), 0) / matches.length;
                    return {
                        teamNumber: tNum,
                        teamName: matches[0].teamName || "Unknown",
                        overallOpr: parseFloat((autoAvg + teleopAvg).toFixed(1)),
                        autoOpr: parseFloat(autoAvg.toFixed(1)),
                        teleopOpr: parseFloat(teleopAvg.toFixed(1)),
                        avgScore: 0, endgame: 0, allianceRank: "--", isCareerCompiledMock: true
                    };
                });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('teamsTableBody');
            if (!tbody) return;

            const sortBy = document.getElementById('sortBy').value;
            let targetDisplayData = generateCompiledDisplayArray();
            
            if(targetDisplayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:20px; color:var(--text-muted);">No team data records found logged in this competition profile view.</td></tr>`;
                return;
            }

            targetDisplayData.sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));
            tbody.innerHTML = '';

            const currentCompContext = competitionsMap.get(activeCompetitionId);
            const isArchived = currentCompContext ? currentCompContext.isArchived : false;

            targetDisplayData.forEach((team) => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-team', team.teamNumber);
                
                const inputsDisabledAttr = (isArchived || team.isCareerCompiledMock) ? "disabled" : "";
                const cleanNotesString = team.teamNotes || "";

                tr.innerHTML = `
                    <td data-label="Team Rank"><input type="number" class="alliance-input" value="${team.allianceRank === 999 ? '' : team.allianceRank}" onchange="updateAllianceRank('${team.teamNumber}', this.value)" ${inputsDisabledAttr}></td>
                    <td data-label="Team #"><b>${team.teamNumber}</b></td>
                    <td data-label="Team Name">${team.teamName}</td>
                    <td data-label="Overall OPR"><strong>${team.overallOpr}</strong></td>
                    <td data-label="Auto OPR">${team.autoOpr}</td>
                    <td data-label="Teleop OPR">${team.teleopOpr}</td>
                    <td data-label="Avg Points">${team.avgScore}</td>
                    <td data-label="Endgame Pts">${team.endgame}</td>
                    <td data-label="Actions" class="notes-column-cell">
                        <button class="notes-toggle-btn" onclick="toggleNotesDrawer('${team.teamNumber}')">Notes</button>
                    </td>
                `;

                const drawerTr = document.createElement('tr');
                drawerTr.className = "drawer-row-wrapper";
                drawerTr.innerHTML = `
                    <td colspan="9" class="drawer-fullwidth-cell">
                        <div class="notes-container" id="notes-${team.teamNumber}">
                            <textarea class="notes-textarea" placeholder="Enter custom observations here...">${cleanNotesString}</textarea>
                            <div class="notes-button-group">
                                ${!team.isCareerCompiledMock ? `<button class="profile-delete-btn" onclick="deleteTeamProfileData('${team.teamNumber}')">Delete Profile</button>` : ''}
                                <button class="notes-close-btn" onclick="toggleNotesDrawer('${team.teamNumber}')">Close</button>
                                <button class="notes-save-btn" onclick="saveTeamNotes('${team.teamNumber}', this.parentNode.previousElementSibling)" ${inputsDisabledAttr}>Save Notes</button>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(tr);
                tbody.appendChild(drawerTr);
                rowVisibilityObserver.observe(tr);
            });
        }

        initializeScoutingEnvironment();
    </script>
</body>
</html>
