<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5115 Scouter Dashboard</title>
    <style>
        /* Team 5115 Brand Color Identity */
        :root {
            --bg-dark: #0a0514;       /* Deep Midnight Purple */
            --bg-card: #150d26;       /* Dark Purple Card Surface */
            --primary: #ff7300;       /* Highly Vibrant Coppery Orange */
            --primary-hover: #e06600; /* Darker vibrant orange */
            --text-main: #f3f0f7;     /* High Contrast Text */
            --text-muted: #a497bd;    /* Lavender Gray Subtexts */
            --border-color: #2b1c47;  /* Purple Framing */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 55px 15px 105px 15px; /* Top padding prevents layout clash with sticky banner */
        }

        h1 { 
            color: var(--primary); 
            font-size: 1.6rem; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}

        /* Tab Visibility Control */
        .app-view { display: none; }
        .app-view.active-view { display: block; }

        /* Form Layout */
        form { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="number"], select, textarea { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.2s ease;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(255, 115, 0, 0.25); 
        }
        
        button { 
            background: var(--primary); 
            color: #fff; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 700; 
            margin-top: 10px; 
            width: 100%; 
            transition: background 0.2s; 
        }
        button:hover { background: var(--primary-hover); }

        /* Sorting Controls Box */
        .controls { 
            margin-bottom: 20px; 
            background: var(--bg-card); 
            padding: 15px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid var(--border-color);
        }
        .controls select { width: 100%; }

        /* Mobile View Cards UI */
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; } 
        
        tr { 
            background: var(--bg-card); 
            margin-bottom: 15px; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            transition: background-color 0.3s ease;
        }
        td { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 0; 
            border-bottom: 1px solid rgba(43, 28, 71, 0.4); 
            font-size: 15px; 
        }
        td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        td[data-label="Team #"] { font-size: 1.35rem; color: var(--primary); }
        
        .alliance-input { 
            width: 75px; 
            padding: 8px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: 700;
            border-radius: 8px; 
            border: 2px solid var(--primary); 
            background: var(--bg-dark);
            color: var(--primary);
        }

        /* 3x Orange Flash Notification Effects */
        .flash-notify {
            animation: orangeFlash 0.5s ease-in-out 3;
        }

        @keyframes orangeFlash {
            0%, 100% { background-color: var(--bg-card); }
            50% { background-color: rgba(255, 115, 0, 0.45); }
        }

        /* Top Sticky Live Feed Ticker System Banner */
        .ticker-banner-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #200f3a;
            border-bottom: 2px solid var(--primary);
            color: #ffffff;
            height: 38px;
            overflow: hidden;
            white-space: nowrap;
            z-index: 2000;
            display: none; 
            align-items: center;
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            animation: scrollTicker 12s linear infinite;
        }
        .ticker-text span {
            color: var(--primary);
        }

        @keyframes scrollTicker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Expanding Live Team Notes UI Block */
        .notes-row {
            border-bottom: none;
            padding-top: 10px;
            display: block;
        }
        .notes-toggle-btn {
            background: #23163d;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            width: auto;
            margin-top: 0;
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .notes-toggle-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--primary);
            display: block;
        }
        .notes-container {
            display: none;
            margin-top: 10px;
            background: var(--bg-dark);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .notes-container.open { display: block; }
        
        /* AI Summary Display Box styling */
        .ai-summary-display {
            background: rgba(255, 115, 0, 0.07);
            border-left: 3px solid var(--primary);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.4;
        }
        .ai-summary-display strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ai-summary-display ul {
            padding-left: 16px;
            margin-top: 4px;
        }

        .notes-textarea {
            width: 100%;
            height: 80px;
            resize: none;
            font-size: 0.9rem;
            padding: 8px;
            margin-bottom: 8px;
        }
        .notes-button-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .notes-save-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
        }
        .notes-ai-btn {
            background: #3a1570;
            border: 1px solid #5a25a3;
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .notes-ai-btn:hover {
            background: #4c1d93;
        }
        .notes-ai-btn svg {
            width: 14px;
            height: 14px;
            fill: #fff;
        }
        .notes-clear { clear: both; }

        /* Floating Pill Navbar with Sliding Slider Animation Track */
        .sketch-navbar-container {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .sketch-navbar-pill {
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            padding: 4px;
            border-radius: 40px;
            display: flex;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            overflow: hidden;
        }

        /* Animated sliding tab indicator bubble backdrop */
        .nav-slider-bubble {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 6px);
            background-color: var(--primary);
            border-radius: 35px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .nav-pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 2; 
            transition: color 0.25s ease;
            width: auto;
            margin: 0;
            line-height: 1;
        }

        .nav-pill-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            display: block;
            flex-shrink: 0;
        }

        .nav-pill-btn.active-tab { color: #ffffff; }

        /* Desktop View Adaptation Settings */
        @media (min-width: 992px) {
            body { padding: 60px 30px 105px 30px; max-width: 1300px; margin: 0 auto; }
            .form-grid { grid-template-columns: repeat(3, 1fr); }
            button { width: auto; padding: 12px 30px; align-self: end; }
            .controls { flex-direction: row; align-items: center; }
            .controls select { width: auto; min-width: 250px; }
            
            table { display: table; width: 100%; border-collapse: separate; border-spacing: 0; background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); }
            thead { display: table-header-group; }
            tbody { display: table-row-group; }
            tr { display: table-row; background: none; margin-bottom: 0; border: none; }
            tr:hover { background-color: rgba(43, 28, 71, 0.3); }
            th, td { display: table-cell; padding: 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
            th { background-color: rgba(21, 13, 38, 0.6); color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
            td::before { content: ""; } 
            td[data-label="Team #"] { font-size: 1rem; color: var(--text-main); }
            .alliance-input { width: 70px; }

            .notes-row { display: table-row; }
            .notes-td { display: table-cell; colspan: 7; padding: 0 14px 14px 14px; border-top: none; }
            .notes-container { margin-top: 0; }
        }
    </style>
</head>
<body>

    <div class="ticker-banner-wrap" id="tickerBanner">
        <div class="ticker-text" id="tickerText"></div>
    </div>

    <h1><span style="color:var(--text-main)">5115</span> Scouter</h1>

    <div id="logView" class="app-view">
        <form id="teamForm">
            <h2>Log / Edit Team Info</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="teamNumber">Team Number</label>
                    <input type="text" id="teamNumber" required placeholder="e.g., 5115" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input type="text" id="teamName" required placeholder="e.g., RoboKnights">
                </div>
                <div class="form-group">
                    <label for="autoOpr">Auto OPR</label>
                    <input type="number" id="autoOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="teleopOpr">Teleop OPR</label>
                    <input type="number" id="teleopOpr" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="avgScore">Avg. Points</label>
                    <input type="number" id="avgScore" step="0.1" required placeholder="0.0">
                </div>
                <div class="form-group">
                    <label for="endgame">Endgame Points</label>
                    <input type="number" id="endgame" step="1" required placeholder="0">
                </div>
                <button type="submit">Save Entry</button>
            </div>
        </form>
    </div>

    <div id="rankingsView" class="app-view active-view">
        <div class="controls">
            <label for="sortBy"><strong>Filter Rank Hierarchy:</strong></label>
            <select id="sortBy" onchange="loadTeams()">
                <option value="allianceRank">Alliance Selection Rank</option>
                <option value="autoOpr">Auto OPR</option>
                <option value="teleopOpr">Teleop OPR</option>
                <option value="avgScore">Avg. Points</option>
                <option value="endgame">Endgame Points</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Alliance Rank</th>
                    <th>Team #</th>
                    <th>Team Name</th>
                    <th>Auto OPR</th>
                    <th>Teleop OPR</th>
                    <th>Avg Points</th>
                    <th>Endgame Pts</th>
                </tr>
            </thead>
            <tbody id="teamsTableBody">
                </tbody>
        </table>
    </div>

    <div class="sketch-navbar-container">
        <div class="sketch-navbar-pill">
            <div class="nav-slider-bubble" id="navBubble"></div>
            
            <button class="nav-pill-btn active-tab" onclick="switchView('rankingsView', this, 0)">
                <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.42 1.72 4.44 4.005 4.901C7.914 15.91 10.13 17 12 17s4.086-1.09 4.995-4.099C19.28 12.44 21 10.42 21 8V7c0-1.1-.9-2-2-2zm-2 5c0 1.2-.53 2.18-1.5 2.65V5h1.5v5zM5 10V5h1.5v7.65C5.53 12.18 5 11.2 5 10zm7 9c-1.66 0-3 1.34-3 3h6c0-1.66-1.34-3-3-3z"/></svg>
                Team Rankings
            </button>
            <button class="nav-pill-btn" onclick="switchView('logView', this, 1)">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Log/Edit Team Info
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        const firebaseConfig = {
            apiKey: "AIzaSyAcPbzSt-iY8RVsYdZpvIfAAS86CwSYa5Q",
            authDomain: "ftc-team-scouter.firebaseapp.com",
            projectId: "ftc-team-scouter",
            storageBucket: "ftc-team-scouter.firebasestorage.app",
            messagingSenderId: "873760240222",
            appId: "1:873760240222:web:3114e1e3fd6661d1d4facf",
            measurementId: "G-ZCQ4RCQBMD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const teamsCollection = collection(db, "ftc_teams");

        let localTeamsArray = [];
        let historicalTeamsMap = new Map(); 
        let observedVisibleTeams = new Set(); 
        let activeViewId = 'rankingsView';
        let bannerQueue = [];
        let bannerIsRunning = false;

        const GEMINI_API_KEY = "AQ.Ab8RN6Ijygst1gJWXfEkTnL5XdRMdEdwR2xlreF2Sm-npBWemw";

        // Fixed Mobile-Friendly Visibility Tracker (Checks bounding client rectangles as a backup to IntersectionObserver)
        const rowVisibilityObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const teamNum = entry.target.getAttribute('data-team');
                if (entry.isIntersecting) {
                    observedVisibleTeams.add(teamNum);
                } else {
                    observedVisibleTeams.delete(teamNum);
                }
            });
        }, { threshold: 0.05, rootMargin: "0px 0px -10px 0px" });

        function isElementInViewport(el) {
            if (!el) return false;
            const rect = el.getBoundingClientRect();
            return (
                rect.top >= 0 &&
                rect.left >= 0 &&
                rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
                rect.right <= (window.innerWidth || document.documentElement.clientWidth)
            );
        }

        // Dynamic Tab Routing Switch
        window.switchView = function(viewId, clickedButton, indexPosition) {
            activeViewId = viewId;
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active-view'));
            document.querySelectorAll('.nav-pill-btn').forEach(btn => btn.classList.remove('active-tab'));
            
            document.getElementById(viewId).classList.add('active-view');
            clickedButton.classList.add('active-tab');
            
            const bubbleOffset = indexPosition * 100;
            document.getElementById('navBubble').style.transform = `translateX(${bubbleOffset}%)`;
            window.scrollTo(0, 0);
        }

        // Form Submit Handler
        document.getElementById('teamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const teamNum = document.getElementById('teamNumber').value.trim();
            
            const teamData = {
                teamNumber: teamNum,
                teamName: document.getElementById('teamName').value.trim(),
                autoOpr: parseFloat(document.getElementById('autoOpr').value),
                teleopOpr: parseFloat(document.getElementById('teleopOpr').value),
                avgScore: parseFloat(document.getElementById('avgScore').value),
                endgame: parseInt(document.getElementById('endgame').value),
            };

            await setDoc(doc(db, "ftc_teams", teamNum), teamData, { merge: true });
            document.getElementById('teamForm').reset();
            switchView('rankingsView', document.querySelectorAll('.nav-pill-btn')[0], 0);
        });

        window.updateAllianceRank = async function(teamNum, newRank) {
            const rankVal = parseInt(newRank);
            await updateDoc(doc(db, "ftc_teams", teamNum), {
                allianceRank: isNaN(rankVal) ? 999 : rankVal
            });
        }

        window.saveTeamNotes = async function(teamNum, textareaElement) {
            const notesText = textareaElement.value.trim();
            const button = textareaElement.nextElementSibling;
            button.innerText = "Saving...";
            
            await updateDoc(doc(db, "ftc_teams", teamNum), {
                teamNotes: notesText
            });
            
            button.innerText = "Saved!";
            setTimeout(() => { button.innerText = "Save Notes"; }, 1500);
        }

        window.generateAiSummary = async function(teamNum, btnElement) {
            const textarea = document.getElementById(`textarea-${teamNum}`);
            const rawNotes = textarea.value.trim();

            if (!rawNotes) {
                alert("Please write or log some basic team notes first before attempting to summarize!");
                return;
            }

            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = `Running AI...`;
            btnElement.disabled = true;

            try {
                const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
                const prompt = `You are a scouting assistant for FTC Team 5115. Summarize these raw scout match notes into short bullet points (max 3 bullets). Focus strictly on robot performance, drive team behavior, autonomous capabilities, errors, or alliance compatibility. Output raw HTML bullets (<ul> and <li> tags) only. Do not add intro conversational text or headers. Raw Notes: "${rawNotes}"`;

                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt,
                });

                const cleanHtmlSummary = response.text.trim();
                await updateDoc(doc(db, "ftc_teams", teamNum), { aiSummary: cleanHtmlSummary });

            } catch (err) {
                console.error("Gemini Engine Failure:", err);
                alert("AI generation failed.");
            } finally {
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        }

        window.toggleNotesDrawer = function(teamNum) {
            const drawer = document.getElementById(`notes-${teamNum}`);
            drawer.classList.toggle('open');
        }

        // Global notification banner ticker processor
        function triggerTickerBanner(teamNumber, teamName, category) {
            bannerQueue.push({ teamNumber, teamName, category });
            if (!bannerIsRunning) {
                processNextBannerItem();
            }
        }

        function processNextBannerItem() {
            if (bannerQueue.length === 0) {
                bannerIsRunning = false;
                document.getElementById('tickerBanner').style.display = 'none';
                return;
            }

            bannerIsRunning = true;
            const item = bannerQueue.shift();
            const bannerContainer = document.getElementById('tickerBanner');
            const tickerTextElement = document.getElementById('tickerText');

            tickerTextElement.innerHTML = `LIVE FEED: Team <span>#${item.teamNumber} (${item.teamName})</span> updated metrics category: <span>[${item.category}]</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
            bannerContainer.style.display = 'flex';

            tickerTextElement.style.animation = 'none';
            tickerTextElement.offsetHeight; 
            tickerTextElement.style.animation = 'scrollTicker 10s linear 1';

            setTimeout(() => {
                processNextBannerItem();
            }, 10000);
        }

        // Real-time Cloud Data Stream Sync Listener Engine
        let isInitialLoad = true;
        onSnapshot(teamsCollection, (snapshot) => {
            let changesToProcess = [];

            snapshot.docChanges().forEach((change) => {
                if (change.type === "modified" && !isInitialLoad) {
                    const freshData = change.doc.data();
                    const oldData = historicalTeamsMap.get(freshData.teamNumber) || {};
                    
                    let matchingCategory = "General Profile Update";
                    
                    // Prioritize text updates and explicit property checking to avoid falsy variations
                    if (freshData.teamNotes !== undefined && freshData.teamNotes !== oldData.teamNotes) {
                        matchingCategory = "Scouting Notes Added";
                    } else if (freshData.aiSummary !== undefined && freshData.aiSummary !== oldData.aiSummary) {
                        matchingCategory = "AI Takeaways Generated";
                    } else if (Number(freshData.autoOpr) !== Number(oldData.autoOpr || 0)) {
                        matchingCategory = "Auto OPR";
                    } else if (Number(freshData.teleopOpr) !== Number(oldData.teleopOpr || 0)) {
                        matchingCategory = "Teleop OPR";
                    } else if (Number(freshData.avgScore) !== Number(oldData.avgScore || 0)) {
                        matchingCategory = "Avg Points";
                    } else if (Number(freshData.endgame) !== Number(oldData.endgame || 0)) {
                        matchingCategory = "Endgame Points";
                    } else if (freshData.allianceRank !== oldData.allianceRank) {
                        matchingCategory = "Alliance Selection Rank";
                    }

                    changesToProcess.push({
                        teamNumber: freshData.teamNumber,
                        teamName: freshData.teamName || "Unknown",
                        category: matchingCategory
                    });
                }
            });

            localTeamsArray = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                if (data.allianceRank === undefined) data.allianceRank = 999;
                if (data.autoOpr === undefined) data.autoOpr = 0;
                if (data.teleopOpr === undefined) data.teleopOpr = 0;
                if (data.teamNotes === undefined) data.teamNotes = ""; 
                if (data.aiSummary === undefined) data.aiSummary = ""; 

                localTeamsArray.push(data);
                historicalTeamsMap.set(data.teamNumber, data);
            });

            renderTable();
            isInitialLoad = false;

            // Trigger animations safely handling mobile display modes
            setTimeout(() => {
                changesToProcess.forEach(change => {
                    const targetRow = document.getElementById(`row-${change.teamNumber}`);
                    const isVisibleViaObserver = observedVisibleTeams.has(change.teamNumber);
                    const isVisibleViaFallback = isElementInViewport(targetRow);
                    const isCurrentlyVisible = (isVisibleViaObserver || isVisibleViaFallback) && (activeViewId === 'rankingsView');

                    if (targetRow && isCurrentlyVisible) {
                        targetRow.classList.remove('flash-notify');
                        targetRow.offsetHeight; 
                        targetRow.classList.add('flash-notify');
                    } else {
                        triggerTickerBanner(change.teamNumber, change.teamName, change.category);
                    }
                });
            }, 50);
        });

        window.loadTeams = function() {
            renderTable();
        }

        function renderTable() {
            const sortBy = document.getElementById('sortBy').value;
            
            localTeamsArray.sort((a, b) => {
                if (sortBy === 'allianceRank') {
                    return a.allianceRank - b.allianceRank;
                } else {
                    return (b[sortBy] || 0) - (a[sortBy] || 0);
                }
            });

            const tbody = document.getElementById('teamsTableBody');
            
            document.querySelectorAll('tr[data-team]').forEach(row => rowVisibilityObserver.unobserve(row));
            tbody.innerHTML = '';

            localTeamsArray.forEach((team) => {
                const tr = document.createElement('tr');
                tr.id = `row-${team.teamNumber}`;
                tr.setAttribute('data-team', team.teamNumber);
                
                const summaryHtml = team.aiSummary 
                    ? `<div class="ai-summary-display"><strong>⚡ AI Scouting Takeaways</strong>${team.aiSummary}</div>`
                    : '';

                tr.innerHTML = `
                    <td data-label="Alliance Rank">
                        <input type="number" class="alliance-input" 
                               value="${team.allianceRank === 999 ? '' : team.allianceRank}" 
                               placeholder="--" 
                               onchange="updateAllianceRank('${team.teamNumber}', this.value)"
                               inputmode="numeric">
                    </td>
                    <td data-label="Team #"><b>${team.teamNumber}</b></td>
                    <td data-label="Team Name">${team.teamName}</td>
                    <td data-label="Auto OPR">${team.autoOpr}</td>
                    <td data-label="Teleop OPR">${team.teleopOpr}</td>
                    <td data-label="Avg Points">${team.avgScore}</td>
                    <td data-label="Endgame Pts">${team.endgame}</td>
                    <td class="notes-row">
                        <button class="notes-toggle-btn" onclick="toggleNotesDrawer('${team.teamNumber}')">
                            <svg viewBox="0 0 24 24">
                                <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                            </svg>
                            View/Edit Notes
                        </button>
                        <div class="notes-container" id="notes-${team.teamNumber}">
                            ${summaryHtml}
                            <textarea class="notes-textarea" id="textarea-${team.teamNumber}" placeholder="Type strategy or raw pit scouting notes here...">${team.teamNotes}</textarea>
                            <div class="notes-button-group">
                                <button class="notes-ai-btn" onclick="generateAiSummary('${team.teamNumber}', this)">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/>
                                    </svg>
                                    AI Summarize
                                </button>
                                <button class="notes-save-btn" onclick="saveTeamNotes('${team.teamNumber}', document.getElementById('textarea-${team.teamNumber}'))">Save Notes</button>
                            </div>
                            <div class="notes-clear"></div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
                rowVisibilityObserver.observe(tr);
            });
        }
    </script>
</body>
</html>
