<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5115 Scouter Dashboard</title>
    <style>
        /* Team 5115 Color Palette Styling */
        :root {
            --bg-dark: #120c1f;       /* Deep Midnight Purple */
            --bg-card: #1c142e;       /* Dark Purple Card Background */
            --primary: #d17a3a;       /* Metallic Coppery Orange */
            --primary-hover: #b8652b; /* Darker Copper */
            --text-main: #f3f0f7;     /* High-contrast Off-White */
            --text-muted: #a69bb5;    /* Muted Lavender/Gray */
            --border-color: #2e2347;  /* Subtle Purple Border */
        }

        /* Global Reset & Body */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 15px;
            line-height: 1.5;
        }

        h1, h2 { font-weight: 700; letter-spacing: -0.5px; }
        h1 { 
            color: var(--primary); 
            font-size: 1.8rem; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main); }

        /* Forms Configuration */
        form { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border-color); 
        }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="number"], select { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.2s ease;
        }
        input:focus, select:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(209, 122, 58, 0.25); 
        }
        
        button { 
            background: var(--primary); 
            color: #fff; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 700; 
            margin-top: 10px; 
            width: 100%; 
            transition: background 0.2s ease; 
        }
        button:hover { background: var(--primary-hover); }

        /* Filtering & Controls */
        .controls { 
            margin-bottom: 20px; 
            background: var(--bg-card); 
            padding: 15px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid var(--border-color);
        }
        .controls select { width: 100%; }

        /* Mobile Layout: Premium Card View UI */
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; } 
        
        tr { 
            background: var(--bg-card); 
            margin-bottom: 15px; 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }
        
        /* Layout specific adjustments to style rows like the design mockup */
        td { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 0; 
            border-bottom: 1px solid rgba(46, 35, 71, 0.5); 
            font-size: 15px; 
        }
        td:last-child { border-bottom: none; }
        td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        
        /* Enhancing specific values within the card rows */
        td[data-label="Team #"] { font-size: 1.3rem; color: var(--primary); }
        
        /* Alliance input container box */
        .alliance-input { 
            width: 75px; 
            padding: 8px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: 700;
            border-radius: 8px; 
            border: 1px solid var(--primary); 
            background: var(--bg-dark);
            color: var(--primary);
        }

        /* Desktop Breakpoint Settings */
        @media (min-width: 768px) {
            body { padding: 30px; max-width: 1200px; margin: 0 auto; }
            .form-grid { grid-template-columns: repeat(3, 1fr); }
            button { width: auto; padding: 12px 30px; align-self: end; grid-column: span 1; }
            .controls { flex-direction: row; align-items: center; }
            .controls select { width: auto; min-width: 250px; }

            /* Table format return on large screens */
            table { display: table; width: 100%; border-collapse: separate; border-spacing: 0; background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); }
            thead { display: table-header-group; }
            tbody { display: table-row-group; }
            tr { display: table-row; background: none; margin-bottom: 0; border: none; }
            tr:hover { background-color: rgba(46, 35, 71, 0.3); }
            th, td { display: table-cell; padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
            th { background-color: rgba(28, 20, 46, 0.8); color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
            td::before { content: ""; } 
            td[data-label="Team #"] { font-size: 1rem; color: var(--text-main); }
            .alliance-input { width: 70px; }
        }
    </style>
</head>
<body>

    <h1>
        <span style="color:var(--text-main)">5115</span> SCOUTER
    </h1>

    <form id="teamForm">
        <h2>Add / Update Team Dataset</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="teamNumber">Team Number</label>
                <input type="text" id="teamNumber" required placeholder="e.g., 5115" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="teamName">Team Name</label>
                <input type="text" id="teamName" required placeholder="e.g., RoboKnights">
            </div>
            <div class="form-group">
                <label for="opr">OPR</label>
                <input type="number" id="opr" step="0.1" required placeholder="0.0">
            </div>
            <div class="form-group">
                <label for="avgScore">Avg. Score</label>
                <input type="number" id="avgScore" step="0.1" required placeholder="0.0">
            </div>
            <div class="form-group">
                <label for="endgame">Endgame Pts</label>
                <input type="number" id="endgame" step="1" required placeholder="0">
            </div>
            <button type="submit">Save Team Entry</button>
        </div>
    </form>

    <div class="controls">
        <label for="sortBy"><strong>Filter Rank Hierarchy:</strong></label>
        <select id="sortBy" onchange="loadTeams()">
            <option value="allianceRank">Alliance Selection Rank (Manual Top Pick)</option>
            <option value="opr">OPR</option>
            <option value="avgScore">Avg. Score</option>
            <option value="endgame">Endgame Pts</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Alliance Rank</th>
                <th>Team #</th>
                <th>Team Name</th>
                <th>OPR</th>
                <th>Avg Score</th>
                <th>Endgame Pts</th>
            </tr>
        </thead>
        <tbody id="teamsTableBody">
            </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your verified configuration profile details maps
        const firebaseConfig = {
            apiKey: "AIzaSyAcPbzSt-iY8RVsYdZpvIfAAS86CwSYa5Q",
            authDomain: "ftc-team-scouter.firebaseapp.com",
            projectId: "ftc-team-scouter",
            storageBucket: "ftc-team-scouter.firebasestorage.app",
            messagingSenderId: "873760240222",
            appId: "1:873760240222:web:3114e1e3fd6661d1d4facf",
            measurementId: "G-ZCQ4RCQBMD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const teamsCollection = collection(db, "ftc_teams");

        let localTeamsArray = [];

        document.getElementById('teamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const teamNum = document.getElementById('teamNumber').value.trim();
            
            const teamData = {
                teamNumber: teamNum,
                teamName: document.getElementById('teamName').value.trim(),
                opr: parseFloat(document.getElementById('opr').value),
                avgScore: parseFloat(document.getElementById('avgScore').value),
                endgame: parseInt(document.getElementById('endgame').value),
            };

            await setDoc(doc(db, "ftc_teams", teamNum), teamData, { merge: true });
            document.getElementById('teamForm').reset();
        });

        window.updateAllianceRank = async function(teamNum, newRank) {
            const rankVal = parseInt(newRank);
            await updateDoc(doc(db, "ftc_teams", teamNum), {
                allianceRank: isNaN(rankVal) ? 999 : rankVal
            });
        }

        onSnapshot(teamsCollection, (snapshot) => {
            localTeamsArray = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                if (data.allianceRank === undefined) data.allianceRank = 999;
                localTeamsArray.push(data);
            });
            renderTable();
        });

        window.loadTeams = function() {
            renderTable();
        }

        function renderTable() {
            const sortBy = document.getElementById('sortBy').value;
            
            localTeamsArray.sort((a, b) => {
                if (sortBy === 'allianceRank') {
                    return a.allianceRank - b.allianceRank;
                } else {
                    return b[sortBy] - a[sortBy];
                }
            });

            const tbody = document.getElementById('teamsTableBody');
            tbody.innerHTML = '';

            localTeamsArray.forEach((team) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="Alliance Rank">
                        <input type="number" class="alliance-input" 
                               value="${team.allianceRank === 999 ? '' : team.allianceRank}" 
                               placeholder="--" 
                               onchange="updateAllianceRank('${team.teamNumber}', this.value)"
                               inputmode="numeric">
                    </td>
                    <td data-label="Team #"><b>${team.teamNumber}</b></td>
                    <td data-label="Team Name">${team.teamName}</td>
                    <td data-label="OPR">${team.opr}</td>
                    <td data-label="Avg Score">${team.avgScore}</td>
                    <td data-label="Endgame Pts">${team.endgame}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
