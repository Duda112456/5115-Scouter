<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5115 Scouter Dashboard Pro</title>
    <style>
        /* Team 5115 Brand Color Identity */
        :root {
            --bg-dark: #0a0514;       /* Deep Midnight Purple */
            --bg-card: #150d26;       /* Dark Purple Card Surface */
            --primary: #ff7300;       /* Highly Vibrant Coppery Orange */
            --primary-hover: #e06600; /* Darker vibrant orange */
            --text-main: #f3f0f7;     /* High Contrast Text */
            --text-muted: #a497bd;    /* Lavender Gray Subtexts */
            --border-color: #2b1c47;  /* Purple Framing */
            --danger: #dc3545;        /* Crimson Red for Delete Actions */
            --success: #28a745;       /* Green for positive states */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 55px 15px 105px 15px; 
        }

        h1 { 
            color: var(--primary); 
            font-size: 1.6rem; 
            padding-bottom: 12px; 
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}

        /* Top Bar Info */
        .comp-status-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 768px) {
            .comp-status-bar { flex-direction: row; }
        }

        .active-comp-info {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .active-comp-info strong {
            color: var(--primary);
        }
        .frozen-badge {
            background: rgba(220, 53, 69, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 6px;
            text-transform: uppercase;
        }

        /* Toggle Button Group Styles */
        .toggle-group {
            display: inline-flex;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 30px;
        }
        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: auto;
            margin-top: 0;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Tab Visibility Control */
        .app-view { display: none; }
        .app-view.active-view { display: block; }

        /* Form Layout */
        form { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="number"], select, textarea { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.2s ease;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(255, 115, 0, 0.25); 
        }
        
        button { 
            background: var(--primary); 
            color: #fff; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 700; 
            margin-top: 10px; 
            width: 100%; 
            transition: background 0.2s; 
        }
        button:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: #23163d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { background: #312054; }

        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover { background: #bd2130; }

        /* Sorting Controls Box */
        .controls { 
            margin-bottom: 20px; 
            background: var(--bg-card); 
            padding: 15px; 
            border-radius: 166px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid var(--border-color);
        }
        .controls select { width: 100%; }

        /* Mobile View Cards UI */
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; } 
        
        tr { 
            background: var(--bg-card); 
            margin-bottom: 15px; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            transition: background-color 0.3s ease;
        }
        td { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 0; 
            border-bottom: 1px solid rgba(43, 28, 71, 0.4); 
            font-size: 15px; 
        }
        td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        td[data-label="Team #"] { font-size: 1.35rem; color: var(--primary); }
        
        .alliance-input { 
            width: 75px; 
            padding: 8px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: 700;
            border-radius: 8px; 
            border: 2px solid var(--primary); 
            background: var(--bg-dark);
            color: var(--primary);
        }
        .alliance-input:disabled {
            border-color: var(--border-color);
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* 3x Orange Flash Notification Effects */
        .flash-notify {
            animation: orangeFlash 0.5s ease-in-out 3;
        }

        @keyframes orangeFlash {
            0%, 100% { background-color: var(--bg-card); }
            50% { background-color: rgba(255, 115, 0, 0.45); }
        }

        /* Top Sticky Live Feed Ticker System Banner */
        .ticker-banner-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #200f3a;
            border-bottom: 2px solid var(--primary);
            color: #ffffff;
            height: 38px;
            overflow: hidden;
            white-space: nowrap;
            z-index: 2000;
            display: none; 
            align-items: center;
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            animation: scrollTicker 12s linear infinite;
        }
        .ticker-text span {
            color: var(--primary);
        }

        @keyframes scrollTicker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Expanding Live Team Notes UI Block */
        .notes-column-cell {
            border-bottom: none;
            padding-top: 10px;
            display: block;
        }
        .notes-toggle-btn {
            background: #23163d;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            width: auto;
            margin-top: 0;
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .notes-toggle-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--primary);
            display: block;
        }
        
        .drawer-row-wrapper {
            display: block;
            width: 100%;
        }

        .notes-container {
            display: none;
            margin-top: 10px;
            background: var(--bg-dark);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        .notes-container.open { display: block; }
        
        /* AI Summary Display Box styling */
        .ai-summary-display {
            background: rgba(255, 115, 0, 0.07);
            border-left: 3px solid var(--primary);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.4;
        }
        .ai-summary-display strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ai-summary-display ul {
            padding-left: 16px;
            margin-top: 4px;
        }

        .notes-textarea {
            width: 100%;
            height: 80px;
            resize: none;
            font-size: 0.9rem;
            padding: 8px;
            margin-bottom: 8px;
        }
        .notes-button-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .notes-save-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
        }
        .notes-ai-btn {
            background: #3a1570;
            border: 1px solid #5a25a3;
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .notes-ai-btn:hover { background: #4c1d93; }
        .notes-ai-btn svg { width: 14px; height: 14px; fill: #fff; }
        
        .profile-delete-btn {
            background: var(--danger);
            padding: 8px 14px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
            margin-right: auto; 
        }
        .profile-delete-btn:hover { background: #bd2130; }

        .notes-clear { clear: both; }

        /* Floating Pill Navbar with Sliding Slider Animation Track */
        .sketch-navbar-container {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .sketch-navbar-pill {
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            padding: 4px;
            border-radius: 40px;
            display: flex;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            overflow: hidden;
        }

        /* Animated sliding tab indicator bubble backdrop */
        .nav-slider-bubble {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 6px);
            background-color: var(--primary);
            border-radius: 35px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .nav-pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
